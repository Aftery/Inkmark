# Inkmark CI 门禁
# ============================================================================
# 为什么需要这个文件：改动本仓库的人（前端 / Go / 菜单 / 文档）此前全靠人肉执行门禁，
# 漏跑一次不会有人知道，直到线上静默失效。本 workflow 把五条门禁固化到每次 push / PR：
#
#   1. frontend      —— 测试网（npm test）+ **README 数字声明同步**（新增，真跑测试网
#                       取实测值）+ 生产构建（npm run build）
#                       + 真渲染冒烟（render-check：防「构建通过但白屏」）
#   2. go            —— 静态检查（go vet）+ 真实编译（go build）+ 测试（go test）
#                       + Linux/Windows 交叉编译（通道③ 的另两个平台适配层）
#   3. p0-emoji      —— P0-1 零 emoji 绝对规则
#   4. docs-contract —— 文档契约（快捷键键位 + 目视清单同步）
#   5. i18n-residue  —— 用户可见文案残留（漏走 t()）
#
# 【2026-10-06 单栏重构后的真源】键位唯一真源是前端命令表
# frontend/src/composables/useShortcuts.js 的 COMMANDS；原生菜单（main.go 的
# buildMenu）已整体下线，故 docs-contract 门禁解析该表而非 main.go。
#
# 平台锁 macos-latest：本应用的 export_pdf_darwin.go 依赖 WebKit / PDFKit
# （ADR-003 路线 A′），只有 macOS runner 能编出真实产物；Linux runner 走
# export_pdf_other.go 降级分支，等于没验证到真正的代码路径。
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # --------------------------------------------------------------------------
  # 门禁 1：前端 —— 测试网 + 生产构建
  # 卡的是「运行时静默失效」：prefs 的受管 CSS 变量契约、菜单事件双向闭合、
  # ⌘P 唯一性、打印样式存在性、行数门禁都在 npm test 里；build 额外保证
  # vite 打包不炸（且产物真能生成，main.go 的 //go:embed 才不会拿到空目录）。
  # Node 必须钉 22：npm test 用的是 Node 内置 node:test，低版本没有该命令。
  # --------------------------------------------------------------------------
  frontend:
    name: 前端测试与构建
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 用 ci 而非 install：严格按 lockfile 装依赖，保证本地与 CI 装出同一棵树
      - name: 安装依赖
        run: npm ci

      - name: 运行测试网
        run: npm test

      # README 数字声明 ↔ 实测（2026-10-17 第十五轮新增）。
      # 挂在 frontend job 而非 docs-contract：本脚本要**真跑一遍测试网**取实测值
      # （静态数 test() 会在参数化/嵌套/条件跳过处失真），而三条测试从
      # @codemirror/* 导入，故必须先有 node_modules —— 只有本 job 跑了 npm ci。
      # 它自己会再跑一次 node --test（约 4s），换取「README 里写死的条数不会
      # 悄悄过期」——这正是第十四轮留下 221/239 那种失真的根因。
      - name: 校验 README 数字声明与实测一致
        run: node ../scripts/verify/verify-readme-claims.mjs

      - name: 生产构建
        run: npm run build

      # 真渲染冒烟：防「进程活着但白屏」类缺陷 —— 构建通过 ≠ 渲染成功
      # （本仓 2026-10-06 的 TDZ 白屏正是构建全绿、界面全白）。
      # 先 --self-test 喂一个必然白屏的反例页面，自证检测器真能报红
      # （门禁没有自检等于没装，见 HANDOFF §5 假绿灯教训）；再对 dist 产物真跑。
      # macOS runner 自带 Chrome，脚本的候选路径可直接命中；退出码 2 = 无浏览器
      # / 服务异常（如实「未验证」，绝不当作通过）。
      - name: 真渲染冒烟（检测器自检）
        run: node ../scripts/smoke/render-check.mjs --self-test

      - name: 真渲染冒烟（dist 产物）
        run: node ../scripts/smoke/render-check.mjs

  # --------------------------------------------------------------------------
  # 门禁 2：Go —— 静态检查 + 真实编译 + 测试
  # 卡的是「编译期才暴露的问题」：go vet 抓 printf 动词错、不可达代码、
  # 锁复制等；go build 保证菜单 / app / 快照 / 监听 / 导出五个文件真能编出二进制。
  # 只 vet 不 build 是不够的——vet 不做链接，cgo 相关的导出代码要 build 才暴露问题。
  #
  # 【2026-10-15 新增 go test】此前本仓**从没有任何 Go 测试**，CI 也不跑测试：
  #   后果是 clipboard_image.go 的格式嗅探（决定「什么字节才算图片」，
  #   错了就会把文本当图片写进 assets/）完全裸奔。判据纯逻辑却零测试，
  #   正是本仓反复记在案的「静默失效温床」。
  #   嗅探器是跨平台共用的一段（macOS/Linux/Windows 三个适配层都把字节交给它判定），
  #   所以它在 macOS runner 上被真覆盖 = 另两个平台的核心判定也被间接验证。
  #   平台适配层的 IO 部分仍需真机验证，不能被这条门禁「冒充已验」（见 HANDOFF §7）。
  # 版本取 go.mod 的 go 指令（1.25.0）；不写 'stable' 之类会随 runner 漂移的别名，
  # 避免「昨天能编今天不能编」。这里显式钉住小版本线即可，具体补丁由 setup-go 解析。
  # --------------------------------------------------------------------------
  go:
    name: Go 静态检查、编译与测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: 静态检查
        run: go vet ./...

      - name: 编译
        run: go build -o /dev/null .

      # cgo 通道（clipboard_darwin.m 走 AppKit）只有 CGO_ENABLED=1 才编进二进制；
      # runner 上虽然默认开着，仍显式钉住，避免默认值变化后门禁静默降级。
      - name: 测试
        run: CGO_ENABLED=1 go test ./...

      # 通道③ 有三个平台适配层（clipboard_darwin/linux/windows.go）。
      # macOS runner 上只编得出 darwin 那一份 —— Linux / Windows 两份
      # **从不在任何门禁里被编译过**，改坏了也不会有人知道（本仓已栽过
      # 「脚本搬目录后路径忘改、一直红着没人发现」的同类坑）。
      # 故显式交叉编译两份，保证它们至少**能编**。
      # 注意：能编 ≠ 真能用。剪贴板 IO 的真机验证仍未做，见 HANDOFF §7。
      - name: 交叉编译 Linux / Windows 适配层（保证不腐烂）
        run: |
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null .

      # 【为什么还要交叉 vet】上面的 go build **不做 vet**，而 `go vet ./...`
      # 在 macOS runner 上只分析 darwin 那份 —— 于是「只在 Windows 文件里才有的
      # 缺陷」两类门禁都抓不到。实测（2026-10 复查）：clipboard_windows.go 的
      # uintptr→unsafe.Pointer 转换就属于这一类，`GOOS=windows go vet` 才报
      # possible misuse，而 CI 一直是绿的。两行命令把这条盲区补上。
      # 只 build 不 vet 不行、只 vet 不 build 也不行 —— 两者查的是不同东西。
      - name: 交叉 vet Linux / Windows 适配层（补「能编但误用」的盲区）
        run: |
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go vet .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet .

  # --------------------------------------------------------------------------
  # 门禁 3：P0-1 零 emoji
  # 卡的是专家团 P0 绝对规则：界面不得用 emoji 表情当功能图标（图标必须是
  # 统一描边、可矢量缩放的 SVG，且统一经 AppIcon.vue 渲染）。
  # 这条规则靠人眼 review 抓不干净（README / 注释 / 字符串里都可能混进去），
  # 必须在 CI 里机检。脚本复用仓库内同一份正则，不在 workflow 里另写一份。
  # 单独拆成 job：它与 build/test 无关，失败时要能一眼看出是「P0 违规」
  # 而不是「测试挂了」，便于定位。
  # --------------------------------------------------------------------------
  p0-emoji:
    name: P0 emoji 门禁
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 显式装 Node，不依赖 runner 的隐式预装版本：p0-check-emoji.sh 正被改写为
      # Node 实现（正则真源移到 scripts/emoji-pattern.mjs），隐式环境一旦漂移
      # 就会变成「本地绿、CI 静默失败或直接报错」，正是要防的静默失效。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 扫 Go 源码：单栏重构后菜单文案已迁到前端字典，但 P0 规则本身
      # 不该因为「某个目录碰巧没有 emoji」就缩小覆盖面。
      - name: 扫描 emoji
        run: ./scripts/p0-check-emoji.sh frontend/src main.go app.go

  # --------------------------------------------------------------------------
  # 门禁 4：文档契约（快捷键键位 + 目视清单同步）
  # 4a 快捷键漂移：2026-10-04 真的发生过两处：
  #   1) README 写「导出 PDF ⌘P」，而命令表的 ⌘P 已是「打印」，导出 PDF 降为 ⌘⇧P；
  #   2) 应用内速查表把加粗写成 ⌘B，与同一张表里的大纲 ⌘B 撞车、含义冲突。
  # 两处都是「人肉 review 没发现、用户直接看到」的错误，故固化为机检。
  # 4b 目视清单漂移：docs/HANDOFF.md §6 是「要验什么」的唯一真源，
  #   docs/qa/visual-checklist.html 是它的可执行副本。两处项数 / 编号 / 标题一旦脱节，
  #   就会出现「照着清单验了，但清单本身漏了一项」这种静默失效——人眼每次核对全部条目不现实。
  #   退出码约定：0=一致 / 1=有漂移 / 2=解析器自身失效（结果不可采信，绝不当作通过）。
  # 单独拆 job：失败时要能一眼看出是「文档与代码脱节」而非「测试挂了」。
  # 脚本零依赖（node 内置 assert 都不用），Node 22 仅为与仓库其余门禁对齐。
  # --------------------------------------------------------------------------
  docs-contract:
    name: 快捷键文档契约
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 真源 = frontend/src/composables/useShortcuts.js 的 COMMANDS 表
      # （2026-10-06 起：原生菜单下线，键位真源由 main.go 的 buildMenu 迁到前端）
      - name: 校验 README 与命令表、速查表的键位
        run: node scripts/verify/verify-shortcuts.mjs

      # 真源 = docs/HANDOFF.md §6；可执行副本 = docs/qa/visual-checklist.html 内嵌清单。
      # 本 job 无 defaults.run.working-directory，工作目录即仓库根，直接用仓库根相对路径。
      - name: 校验目视清单与 HANDOFF §6 同步
        run: node scripts/verify/verify-visual-checklist.mjs

  # --------------------------------------------------------------------------
  # 门禁 5：i18n 文案残留
  # 卡的是「新增/改文案时漏了 t()」——国际化（zh-CN/en-US/ja-JP）落地后，
  # 任何新写的用户可见文案若硬编码中文，切到英文/日文界面就会露出中文。
  # 这类漂移人眼 review 抓不到（尤其 aria-label、title 这类不显眼的位置），
  # 且「漏一个」就是用户可见的缺陷，故固化为机检。
  # 单独拆 job：失败时要能一眼看出是「文案没走 t()」而非「测试挂了」。
  # 脚本自带剥注释器与逐条白名单（每条写明理由），行尾注释不计残留。
  # 退出码：0=干净 / 1=有残留 / 2=扫描器自身失效（不可采信）。
  # --------------------------------------------------------------------------
  i18n-residue:
    name: i18n 文案残留
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 扫描未走 t() 的用户可见文案
        run: node scripts/verify/scan-i18n-residue.mjs
